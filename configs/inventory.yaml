# Synthetic lab inventory. Every device is served by the local simulator
# (see docs/SIMULATION in README); nothing here refers to real hardware.
devices:
  - id: switch-01
    hostname: switch-01.lab.example
    management_address: simulator:16101
    device_type: switch
    vendor: acme
    model: as-24p
    serial_number: SIM-SW-0001
    site: lab
    tags: [core, automation-enabled]
    capabilities: [snmp, interface-admin]
    credentials_ref: snmp/lab
    collection: {protocol: snmp, profile: generic-switch, interval: 10s}
