id: vendor-ap
description: >-
  Wireless access point. Reports CPU as vendor.cpu.load (0..100) and temperature
  in tenths of a degree; both are normalized by JavaScript transforms to show
  that vendor quirks can be handled without touching the Go binaries.
include: [system, interfaces]
match:
  sysobjectid_prefix: "1.3.6.1.4.1.32473.2.1"
metrics:
  - {name: vendor.cpu.load, oid: 1.3.6.1.4.1.32473.2.1.1.0, type: gauge}
  - {name: vendor.temperature.decic, oid: 1.3.6.1.4.1.32473.2.1.2.0, type: gauge}
  - {name: snmp.wirelessClients, oid: 1.3.6.1.4.1.32473.2.1.3.0, type: gauge}
